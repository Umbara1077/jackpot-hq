name: Refresh lottery data
on:
  schedule:
    - cron: '7 * * * *'   # hourly at :07
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-live.mjs
      - name: Commit if changed
        run: |
          git config user.name 'jackpot-hq-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live.json
          git diff --cached --quiet && echo "no new data" && exit 0
          git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push   # pushing to main triggers pages.yml, republishing the site with fresh data
